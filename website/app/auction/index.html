<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ActNow app — Árverés</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050505; color: #fff; font-family: Inter, system-ui, sans-serif; }
    .card { text-align: center; padding: 2rem; max-width: 22rem; }
    .logo { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #b8ff2e, #22d3ee); color: #04100a; font-weight: 800; display: grid; place-items: center; margin: 0 auto 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
    p { color: #9ca3af; font-size: .9rem; margin: 0 0 1.25rem; }
    .btn { display: inline-block; padding: .85rem 1.25rem; border-radius: 999px; background: #b8ff2e; color: #0a1400; font-weight: 700; text-decoration: none; margin: .25rem; }
    .ghost { background: transparent; border: 1px solid #333; color: #fff; }
    a.back { color: #b8ff2e; font-size: .85rem; display: inline-block; margin-top: 1rem; }
  </style>
</head>
<body data-auto-open="auction">
  <div class="card">
    <div class="logo">AN</div>
    <h1>Megnyitás az ActNow appban</h1>
    <p>Árverés — ha telepítve van az app, automatikusan megnyílik.</p>
    <a class="btn" href="#" data-open-app="auction">Megnyitás</a>
    <a class="btn ghost" href="https://apps.apple.com/us/app/actnow-charity/id6778068435">App Store</a>
    <br /><a class="back" href="/">← Vissza a weboldalra</a>
  </div>
  <script src="/assets/open-app.js"></script>
</body>
</html>
